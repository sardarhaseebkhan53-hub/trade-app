# Fixes: "Upgrading gradle.properties" loop - this file now matches Flutter 3.35+ template
# + extra resilience to avoid Windows locks
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRResources=true

# JVM - AGP 8.11.1 + Kotlin 2.2.20 needs Xmx4G and Metaspace
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Resilience settings (these DO NOT trigger Flutter's Upgrading check) ---
# Disable features that cause "Timeout waiting to lock build logic queue" on Windows
# Owner PID / Our PID / buildLogic.lock bug in Gradle 8.13+
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.configureondemand=false

# Enable caching and daemon for speed, but disable daemon lock contention
org.gradle.caching=true
org.gradle.daemon=true

# Network: fixes "Gradle threw an error while downloading artifacts from the network"
# and "Timeout of 120000 reached waiting for exclusive access to file"
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.retry.maxAttempts=10
systemProp.org.gradle.internal.http.retry.initialBackOffMs=2000
systemProp.org.gradle.internal.http.socket.keepAlive=true
