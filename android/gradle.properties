android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRResources=true
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=true

# JVM args - increased heap and metaspace for AGP 8.11 + Kotlin 2.2 + Flutter
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Configuration cache - speeds up subsequent builds (safe for Flutter AGP 8.7+)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Network resilience - fixes "Gradle threw an error while downloading artifacts from the network"
# and timeouts on slow / flaky connections
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.retry.maxAttempts=5
systemProp.org.gradle.internal.http.retry.initialBackOffMs=1000

# AndroidX and Kotlin code style for R8
android.useMinimalKeepRules=false
