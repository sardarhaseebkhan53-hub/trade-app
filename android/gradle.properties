# Flutter 3.38+ / 3.44 template keys.
# Missing android.newDsl or android.builtInKotlin makes `flutter run`
# print "Upgrading gradle.properties" and rewrite this file every launch.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Keep the legacy AGP DSL and Kotlin Gradle Plugin. Required until the
# Flutter Gradle Plugin migrates to AGP 9 newDsl / built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false

# --- Resilience settings (org.gradle.* / systemProp.* are ignored by Flutter's migrator) ---
# Disable features that cause "Timeout waiting to lock build logic queue" on Windows
# Owner PID / Our PID / buildLogic.lock bug in Gradle 8.13+
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.configureondemand=false

# Enable caching and daemon for speed, but disable daemon lock contention
org.gradle.caching=true
org.gradle.daemon=true

# Network: fixes "Gradle threw an error while downloading artifacts from the network"
# and "Timeout of 120000 reached waiting for exclusive access to file"
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.retry.maxAttempts=10
systemProp.org.gradle.internal.http.retry.initialBackOffMs=2000
systemProp.org.gradle.internal.http.socket.keepAlive=true
