distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip
# FIX #1: Was 10000ms (10s) - too low for PK network, causes partial zip + .lck leak
# Set to 120000ms (2min) to allow full 130MB download
# Fixes: "Timeout of 120000 reached waiting for exclusive access to file: gradle-8.14.4-bin.zip"
# Fixes: "Gradle threw an error while downloading artifacts from the network"
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
